services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medchronicle
      POSTGRES_PASSWORD: medchronicle
      POSTGRES_DB: medchronicle
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U medchronicle"], interval: 5s, retries: 10 }

  # Optional local Qdrant. Point QDRANT_URL at Qdrant Cloud instead to skip this.
  qdrant:
    image: qdrant/qdrant:v1.15.0
    ports: ["6333:6333"]
    volumes: [qdrant:/qdrant/storage]

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://medchronicle:medchronicle@postgres:5432/medchronicle
      UPLOAD_DIR: /app/uploads
    volumes: [uploads:/app/uploads]
    ports: ["8000:8000"]
    depends_on: { postgres: { condition: service_healthy } }

  frontend:
    build:
      context: ./frontend
      args: { BACKEND_API_URL: "http://backend:8000" }
    ports: ["3000:3000"]
    depends_on: [backend]

volumes: { pgdata: {}, qdrant: {}, uploads: {} }
